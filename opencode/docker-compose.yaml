services:
  sudeep-agent:
    build: .
    stdin_open: true
    tty: true
    tmpfs:
      - /tmp:size=4G
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    ports:
      - "127.0.0.1:4321:4321" # astro
      - "127.0.0.1:8000:8000" # litestar
    volumes:
      - work:/workspace              # holds project-a/, project-b/, etc. via git clone
    environment:
      - GIT_AUTHOR_NAME=sudeep
      - GIT_AUTHOR_EMAIL=yohermesbot@gmail.com
      - GIT_COMMITTER_NAME=sudeep
      - GIT_COMMITTER_EMAIL=yohermesbot@gmail.com

volumes:
  work:
