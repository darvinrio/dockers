services:
  sudeep-agent:
    build:
      context: .
    stdin_open: true
    tty: true
    tmpfs:
      - /tmp:size=4G,exec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:4321:4321" # astro
      - "127.0.0.1:8080:8080" # litestar
      - "127.0.0.1:2222:2222" # dropbear ssh
      - "127.0.0.1:4096:4096" # opencode HTTP server (web UI + API)
    volumes:
      - work:/workspace              # holds project-a/, project-b/, etc. via git clone
      - ssh_keys:/home/sudeep/.ssh   # persists dropbear host key across rebuilds
      # Agent chat history + saved logins. Named volumes (not host bind mounts)
      # keep SQLite on the VM's ext4, where locking and fsync work normally.
      - opencode_data:/home/sudeep/.local/share/opencode    # sessions DB, snapshots, tool output, logins
      - opencode_state:/home/sudeep/.local/state/opencode   # prompt history, last model, TUI tabs
      - pi_data:/home/sudeep/.pi          # pi sessions, agent config, credentials
    secrets:
      - source: github_pat
        target: github_pat
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: authorized_keys
        target: /home/sudeep/.ssh/authorized_keys
        uid: "1000"
        gid: "1000"
        mode: 0400
    environment:
      # Bind the opencode server to 0.0.0.0:4096 so the published port works
      # (see sandbox-entry). Set to 0 to run the sandbox without it.
      - OPENCODE_SERVE=1
      # Optional fixed password for the opencode server; when unset, a random
      # one is generated per container and stored in ~/.config/opencode/service.json.
      - OPENCODE_PASSWORD
      - GIT_AUTHOR_NAME=sudeep
      - GIT_AUTHOR_EMAIL=yohermesbot@gmail.com
      - GIT_COMMITTER_NAME=sudeep
      - GIT_COMMITTER_EMAIL=yohermesbot@gmail.com

volumes:
  work:
  ssh_keys:
  opencode_data:
  opencode_state:
  pi_data:

secrets:
  github_pat:
    file: ./secrets/github_pat
  authorized_keys:
    file: ./secrets/authorized_keys/opencode_container.pub
