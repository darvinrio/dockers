services:
  sudeep-agent:
    build: .
    stdin_open: true
    tty: true
    tmpfs:
      - /tmp:size=4G
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    ports:
      - "4321:4321" # astro
      - "8000:8000" # litestar
    volumes:
      - work:/workspace              # holds project-a/, project-b/, etc. via git clone
    secrets:
      - bot_ssh_key
    environment:
      - GIT_SSH_COMMAND=ssh -i /run/secrets/bot_ssh_key -o IdentitiesOnly=yes
      - GIT_AUTHOR_NAME=sudeep
      - GIT_AUTHOR_EMAIL=yohermesbot@gmail.com
      - GIT_COMMITTER_NAME=sudeep
      - GIT_COMMITTER_EMAIL=yohermesbot@gmail.com

volumes:
  work:

secrets:
  bot_ssh_key:
    file: keys/opencode_git_ed25519
