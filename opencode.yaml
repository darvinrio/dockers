services:
  agent:
    build: .
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/opencode
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    ports:
      - "4321:4321" # astro
      - "8000:8000" # litestar
    volumes:
      - work:/workspace              # holds project-a/, project-b/, etc. via git clone
      - datasets:/workspace/data:ro   # your parquet(s), docker-owned, read-only
    secrets:
      - git_deploy_key_a
      - git_deploy_key_b
    networks:
      - egress-restricted

volumes:
  work:
  datasets:
    external: true

secrets:
  git_deploy_key_a:
    file: ./deploy_key_a
  git_deploy_key_b:
    file: ./deploy_key_b

networks:
  egress-restricted:
    driver: bridge
